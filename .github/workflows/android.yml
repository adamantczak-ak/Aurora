name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName (stays 1.0.0: only the versionCode grows, so builds still install over each other)'
        required: false
        default: '1.0.0'
      tests:
        description: 'Run the unit tests first (slower)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION:-1.0.0}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Unit tests
        if: github.event.inputs.tests == 'true'
        run: ./gradlew testDebugUnitTest :api:test :api-spotify:test :host-cdp:test

      - name: Signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias beta -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Signed beta APK
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/release.jks
          MYSPOTI_KEYSTORE_PASSWORD: android
          MYSPOTI_KEY_ALIAS: beta
          MYSPOTI_KEY_PASSWORD: android
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          ./gradlew assembleRelease \
            -PappBeta=true \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Aurora-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Aurora-${{ steps.version.outputs.version }}
          path: base/app/build/outputs/apk/release/Aurora-*.apk
          if-no-files-found: error
          retention-days: 14
